- id: valtersit-cve-scan
  name: ValtersIT CVE scan (changed dependency files)
  description: >-
    Submits the pinned package versions from staged lockfiles / manifests to the ValtersIT API and
    reports matched CVEs. Sends package name + version only.
  entry: run_scan.py
  language: script
  files: (^|/)(requirements[^/]*\.txt|package-lock\.json|npm-shrinkwrap\.json|Gemfile\.lock|composer\.lock|packages\.lock\.json|[^/]+\.(cs|fs|vb)proj|packages\.config)$
  pass_filenames: true
  require_serial: true
